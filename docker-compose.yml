services:
  payroll:
    image: ghcr.io/thehfhotel/payroll:latest
    build: .
    container_name: payroll-form
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  kbiz-bot:
    image: ghcr.io/thehfhotel/payroll-kbiz-bot:latest
    build:
      context: .
      dockerfile: kbiz-bot/Dockerfile
    container_name: kbiz-bot
    volumes:
      - ./data:/app/data
      - kbiz-bot-profile:/app/kbiz-bot/browser-data
    env_file:
      - .env
    depends_on:
      - payroll
    restart: unless-stopped

volumes:
  kbiz-bot-profile:
