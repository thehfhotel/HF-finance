# Reimbursement web container — serves the Vite SPA and reverse-proxies API
# traffic to the `api` service on the per-app docker network. The host-level
# shared-nginx vhost (deploy/nginx/reimbursement.conf) sits in front of THIS
# container by DNS name (`reimbursement-web`) on the shared-nginx network.

# Resolve container names via Docker's embedded DNS at 127.0.0.11. The `valid`
# TTL keeps DNS fresh after `docker compose up`'s rolling restart so we don't
# pin a stale IP for the api service.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── DO NOT reintroduce an `upstream { server api:3001; }` block here ──────────
#
# In open-source nginx, hostnames inside an `upstream` block are resolved ONCE,
# at config-load time, and cached for the life of the process. The `resolver`
# directive above does NOT apply to them — re-resolving upstream members needs
# the `resolve` parameter, which is NGINX Plus only.
#
# That bit us in production on 2026-08-10: the api container crashed on boot
# (prisma migrate could not reach postgres yet), restarted, and Docker handed it
# a new IP. nginx kept dialling the dead address and every /api/ request 502'd —
# so Cloudflare Access login was down while all three containers still reported
# "healthy". See the `$api_upstream` usage below.
#
# The address MUST reach proxy_pass through a variable: that is what defers
# resolution to request time and makes the `valid=10s` TTL above real. The cost
# is the upstream keepalive pool (a variable target cannot use one), which is
# negligible at this app's traffic.
map $host $api_upstream {
    default "http://api:3001";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security defaults — TLS terminates upstream at Cloudflare/shared-nginx,
    # so we keep these conservative and let the edge add HSTS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large receipt-photo uploads (multipart/form-data via the api).
    # Receipts are typically ≤ 10 MB; bump the ceiling to 25 MB for headroom
    # without inviting abuse.
    client_max_body_size 25m;

    # Gzip text-y assets. Vite emits hashed filenames, so we let the client
    # cache aggressively below.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # API reverse proxy — Elysia listens on :3001 inside the api container.
    # $api_upstream (not a literal host) so DNS is re-resolved per request.
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Receipt / transfer-screenshot uploads served by the api container.
    # `^~` makes this prefix take priority over the regex .jpg/.png/etc.
    # block below — without it, imp_*.jpg would match the regex first and
    # be served (404) from the SPA's static dir instead of being proxied.
    location ^~ /uploads/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Hashed Vite assets — safe to cache for a year.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Container-local healthcheck endpoint (used by the host vhost's optional
    # probe). Answered by nginx itself — it proves this container is up, but
    # says NOTHING about whether the api behind it is reachable.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # End-to-end healthcheck: travels the same proxy path as /api/, so a stale
    # or dead api upstream turns this container unhealthy instead of leaving it
    # green while every real request 502s. This is the container HEALTHCHECK.
    # The api's own health route is /health at its root, not under /api/.
    location = /healthz/upstream {
        access_log off;
        proxy_pass         $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
    }

    # SPA fallback — React Router handles client-side routes, so any path
    # that isn't a real file is served the index.html shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must never be cached, or browsers keep loading a stale
    # bundle after a deploy (the hashed assets above stay immutable). Note:
    # add_header cancels inheritance, so the security headers are repeated.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hide dotfiles.
    location ~ /\. {
        deny all;
    }
}
