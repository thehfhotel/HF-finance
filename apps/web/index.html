<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เบิกค่าใช้จ่าย</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1A1815; font-family: Arial, sans-serif; }
      body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 30% 20%, #2a2419 0%, #0F0D0B 60%);
        padding: 30px 20px;
        box-sizing: border-box;
      }
      #app { display: flex; align-items: center; justify-content: center; }
      *::-webkit-scrollbar { width: 0; height: 0; }
      /* HF One shell band (hf-bar.js) renders in normal flow at the top of
         <body> via a #hf-bar-host element. This app's screens use
         position: fixed for full-viewport chrome, which would otherwise
         render underneath the band. :has() flips an offset var the fixed
         screens read (falling back to 0 if the bar fails to load), per the
         documented gotcha in HF-ONE.md. */
      body:has(> #hf-bar-host) { --hf-band-offset: 46px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
