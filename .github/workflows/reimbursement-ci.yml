name: Reimbursement CI

on:
  push:
    branches: [main]
    paths: ['reimbursement/**', '.github/workflows/reimbursement-ci.yml']
  pull_request:
    branches: [main]
    paths: ['reimbursement/**', '.github/workflows/reimbursement-ci.yml']
  workflow_dispatch:

# A push to main also kicks the deploy workflow; cancel any in-flight CI on
# the same branch so we don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: reimbursement

jobs:
  typecheck:
    name: Typecheck (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun --filter api db:generate

      - name: Typecheck
        run: bun run typecheck

  build-images:
    name: Build (api + web) — smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only on PRs — main pushes go through the deploy workflow which builds
    # AND pushes. Avoid duplicating the docker work here.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Build api (no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ./reimbursement
          file: ./reimbursement/Dockerfile.api
          push: false
          cache-from: type=gha,scope=reimbursement-v2-api
          platforms: linux/amd64
      - name: Build web (no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ./reimbursement
          file: ./reimbursement/Dockerfile.web
          push: false
          cache-from: type=gha,scope=reimbursement-v2-web
          platforms: linux/amd64
